server:
  port: 8085

spring:
  application:
    name: feedback-service

  datasource:
    url: jdbc:mysql://localhost:3306/hostel_feedback
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

jwt:
  secret: hfms-super-secret-key-that-is-at-least-32-characters-long